name: Hadolint
description: "Lint Dockerfiles via hadolint/hadolint-action (reuse with uses: ./.github/actions/hadolint)"
inputs:
  failure-threshold:
    description: Fail when violations meet or exceed this severity (error, warning, info, style, ignore). Default error avoids failing on existing style warnings while still failing on errors.
    required: false
    default: "error"
  ignore:
    description: Comma-separated Hadolint rule codes to ignore
    required: false
    default: ""
  trusted-registries:
    description: Comma-separated trusted registry URLs
    required: false
    default: ""
  dockerfile:
    description: Path to Dockerfile to lint (workflows often pass this from a matrix)
    required: false
    default: "official-templates/base/Dockerfile"
  format:
    description: "Hadolint output format (tty, json, sarif, checkstyle, ...)"
    required: false
    default: "sarif"
  output-file:
    description: Path under the workspace where results are written (required for non-tty formats used with upload-sarif)
    required: false
    default: "hadolint.sarif"

runs:
  using: composite
  steps:
    - id: hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ${{ inputs.dockerfile }}
        failure-threshold: ${{ inputs.failure-threshold }}
        ignore: ${{ inputs.ignore }}
        trusted-registries: ${{ inputs.trusted-registries }}
        format: ${{ inputs.format }}
        output-file: ${{ inputs.output-file }}
