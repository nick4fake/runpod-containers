name: Shellcheck

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          format: json1
          severity: warning
