name: Docker Image Build and Release

on:
  pull_request:
    paths:
      - ".github/workflows/base.yml"
      - "official-templates/base/docker-bake.hcl"
      - "official-templates/base/Dockerfile"
      - "official-templates/pytorch/docker-bake.hcl"
      - "official-templates/pytorch/Dockerfile"
      - "official-templates/autoresearch/docker-bake.hcl"
      - "official-templates/autoresearch/Dockerfile"
      - "official-templates/shared/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest #blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # - name: Setup Docker
      #   uses: ./.github/actions/docker-setup
      #   id: setup
      #   with:
      #     dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build base images
        id: bake
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/base/docker-bake.hcl
          load: true
          push: false #true
      
      # - name: Install Grype
      #   run: |
      #     curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin

      # - name: Grype scan all images from bake metadata
      #   env:
      #     BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
      #   run: |
      #     set -euo pipefail
      #     echo "${BAKE_METADATA}" | jq -r 'to_entries[] | .value["image.name"] // empty' | sort -u > "${RUNNER_TEMP}/grype-refs.txt"
      #     if ! grep -q . "${RUNNER_TEMP}/grype-refs.txt"; then
      #       echo "No image.name in bake metadata"
      #       exit 1
      #     fi
      #     echo "Scanning:"
      #     cat "${RUNNER_TEMP}/grype-refs.txt"
      #     while IFS= read -r ref || [ -n "${ref}" ]; do
      #       [ -z "${ref}" ] && continue
      #       grype "${ref}"
      #       echo "::endgroup::"
      #     done < "${RUNNER_TEMP}/grype-refs.txt"

      - name: Keep only the image under test
        env:
          KEEP: docker.io/runpod/base:1.0.3-cuda1281-ubuntu2204
        run: |
          set -euo pipefail
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -v '^<none>:<none>$' \
            | grep -v "^${KEEP}$" \
            | xargs -r -n1 docker rmi -f || true
          docker image prune -af
          docker builder prune -af
          df -h /

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/runpod/base:1.0.3-cuda1281-ubuntu2204
          format: table
          ignore-unfixed: true

      - name: Grype
        uses: anchore/scan-action@v7
        with:
          image: docker.io/runpod/base:1.0.3-cuda1281-ubuntu2204

  build-autoresearch:
    needs: build-base
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if build is needed
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          files_yaml: |
            autoresearch:
              - 'official-templates/shared/**'
              - 'official-templates/base/**'
              - 'official-templates/autoresearch/**'

      - name: Setup Docker
        if: steps.changes.outputs.autoresearch_any_changed == 'true'
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build autoresearch images
        if: steps.changes.outputs.autoresearch_any_changed == 'true'
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/autoresearch/docker-bake.hcl
          push: true

  build-pytorch:
    needs: build-base
    # always() forces job run even if the dependant is skipped (but not if it failed)
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if build is needed
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          files_yaml: |
            pytorch:
              - 'official-templates/shared/**'
              - 'official-templates/pytorch/**'

      - name: Setup Docker
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.pytorch_any_changed == 'true'
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build pytorch images
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.pytorch_any_changed == 'true'
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/pytorch/docker-bake.hcl
          push: true
