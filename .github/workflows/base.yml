name: Docker Image Build and Release

on:
  pull_request:
    paths:
      - ".github/workflows/base.yml"
      - "official-templates/base/docker-bake.hcl"
      - "official-templates/base/Dockerfile"
      - "official-templates/pytorch/docker-bake.hcl"
      - "official-templates/pytorch/Dockerfile"
      - "official-templates/autoresearch/docker-bake.hcl"
      - "official-templates/autoresearch/Dockerfile"
      - "official-templates/shared/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest #blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      # - name: Setup Docker
      #   uses: ./.github/actions/docker-setup
      #   id: setup
      #   with:
      #     dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build base images
        id: bake
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: "test"
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/base/docker-bake.hcl
          # push: true
          load: true
          push: false

      # aquasecurity/trivy-action accepts only one image-ref per step; workflows cannot loop `uses:`.
      # Same job + load:true → each image.name exists locally.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.1

      - name: Trivy scan all images from bake metadata
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          echo "${BAKE_METADATA}" | jq -r 'to_entries[] | .value["image.name"] // empty' | sort -u > "${RUNNER_TEMP}/trivy-refs.txt"
          if ! grep -q . "${RUNNER_TEMP}/trivy-refs.txt"; then
            echo "No image.name in bake metadata"
            exit 1
          fi
          echo "Scanning:"
          cat "${RUNNER_TEMP}/trivy-refs.txt"
          while IFS= read -r ref || [ -n "${ref}" ]; do
            [ -z "${ref}" ] && continue
            echo "::group::Trivy — ${ref}"
            trivy image \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --ignore-unfixed \
              --vuln-type os,library \
              --format table \
              --no-progress \
              "${ref}"
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/trivy-refs.txt"

      # Optional: one pinned trivy-action step for a single “golden” ref (same flags as above).
      # - name: Run Trivy vulnerability scanner (one image)
      #   uses: aquasecurity/trivy-action@v0.31.0
      #   with:
      #     image-ref: 'docker.io/runpod/base:1.0.3test-ubuntu2204'
      #     format: table
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: os,library
      #     severity: CRITICAL,HIGH

  build-autoresearch:
    needs: build-base
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest #blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if build is needed
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          files_yaml: |
            autoresearch:
              - 'official-templates/shared/**'
              - 'official-templates/base/**'
              - 'official-templates/autoresearch/**'

      - name: Setup Docker
        if: steps.changes.outputs.autoresearch_any_changed == 'true'
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build autoresearch images
        if: steps.changes.outputs.autoresearch_any_changed == 'true'
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/autoresearch/docker-bake.hcl
          # push: true
          push: false

  build-pytorch:
    needs: build-base
    # always() forces job run even if the dependant is skipped (but not if it failed)
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest #blacksmith-16vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if build is needed
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          files_yaml: |
            pytorch:
              - 'official-templates/shared/**'
              - 'official-templates/pytorch/**'

      - name: Setup Docker
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.pytorch_any_changed == 'true'
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build pytorch images
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.pytorch_any_changed == 'true'
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/pytorch/docker-bake.hcl
          # push: true
          push: false
