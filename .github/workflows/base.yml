name: Docker Image Build and Release

on:
  pull_request:
    paths:
      - ".github/workflows/base.yml"
      - "official-templates/base/docker-bake.hcl"
      - "official-templates/base/Dockerfile"
      - "official-templates/pytorch/docker-bake.hcl"
      - "official-templates/pytorch/Dockerfile"
      - "official-templates/autoresearch/docker-bake.hcl"
      - "official-templates/autoresearch/Dockerfile"
      - "official-templates/shared/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest #blacksmith-8vcpu-ubuntu-2204
    outputs:
      images: ${{ steps.refs.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build base images
        id: bake
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }} #"-${{ github.event.pull_request.number }}"
          DOCKERHUB_REPOSITORY: "mchekm/runpod-containers"
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/base/docker-bake.hcl
          push: true

      # Extract the JSON array of image refs (each target's image.name) for the trivy matrix below.
      - name: Collect pushed image refs
        id: refs
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          IMAGES=$(echo "${BAKE_METADATA}" | jq -c '[.[] | ."image.name"] | map(select(. != null)) | unique')
          echo "images=${IMAGES}" >> "${GITHUB_OUTPUT}"
          echo "Will scan:"
          echo "${IMAGES}" | jq .

  trivy-base:
    needs: build-base
    if: needs.build-base.outputs.images != '' && needs.build-base.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.build-base.outputs.images) }}
    steps:
      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  build-autoresearch:
    needs: build-base
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest #blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if build is needed
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          files_yaml: |
            autoresearch:
              - 'official-templates/shared/**'
              - 'official-templates/base/**'
              - 'official-templates/autoresearch/**'

      - name: Setup Docker
        if: steps.changes.outputs.autoresearch_any_changed == 'true'
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build autoresearch images
        if: steps.changes.outputs.autoresearch_any_changed == 'true'
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/autoresearch/docker-bake.hcl
          # push: true
          push: false

  build-pytorch:
    needs: build-base
    # always() forces job run even if the dependant is skipped (but not if it failed)
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest #blacksmith-16vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if build is needed
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          files_yaml: |
            pytorch:
              - 'official-templates/shared/**'
              - 'official-templates/pytorch/**'

      - name: Setup Docker
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.pytorch_any_changed == 'true'
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build pytorch images
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.pytorch_any_changed == 'true'
        uses: docker/bake-action@v6
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_SUFFIX: ${{ steps.setup.outputs.release-suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/pytorch/docker-bake.hcl
          # push: true
          push: false
