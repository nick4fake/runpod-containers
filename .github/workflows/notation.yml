name: Notation

on:
  pull_request:
    paths:
      - ".github/workflows/notation.yml"

permissions:
  contents: read

env:
  SOURCE_IMAGE: ubuntu:resolute
  IMAGE_REPO: docker.io/mchekm/runpod-containers
  IMAGE_TAG: ubuntu-latest-notation
  SIGNER_NAME: runpod-signer

jobs:
  notation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull, retag and push image
        id: push
        run: |
          TARGET_IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"
          docker pull "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"
          DIGEST=$(docker buildx imagetools inspect "${TARGET_IMAGE}" \
                    | awk '/^Digest:/ {print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Notation
        uses: notaryproject/notation-action/setup@v1
        with:
          version: "1.3.1"

      - name: Restore signing key and certificate
        env:
          NOTATION_SIGNING_KEY: ${{ secrets.NOTATION_SIGNING_KEY }}
          NOTATION_SIGNING_CERT: ${{ secrets.NOTATION_SIGNING_CERT }}
        run: |
          CONFIG_DIR="$HOME/.config/notation"
          KEY_DIR="${CONFIG_DIR}/localkeys"
          mkdir -p "${KEY_DIR}"
          printf '%s' "${NOTATION_SIGNING_KEY}"  | base64 -d > "${KEY_DIR}/${SIGNER_NAME}.key"
          printf '%s' "${NOTATION_SIGNING_CERT}" | base64 -d > "${KEY_DIR}/${SIGNER_NAME}.crt"
          chmod 600 "${KEY_DIR}/${SIGNER_NAME}.key"

          cat > "${CONFIG_DIR}/signingkeys.json" <<EOF
          {
            "default": "${SIGNER_NAME}",
            "keys": [
              {
                "name": "${SIGNER_NAME}",
                "keyPath": "${KEY_DIR}/${SIGNER_NAME}.key",
                "certPath": "${KEY_DIR}/${SIGNER_NAME}.crt"
              }
            ]
          }
          EOF

          notation key list

      - name: Sign image with Notation
        run: |
          notation sign \
            --key "${SIGNER_NAME}" \
            "${IMAGE_REPO}@${{ steps.push.outputs.digest }}"

      - name: Prepare trust policy and trust store
        run: |
          TRUST_STORE_DIR=".notation/truststore/x509/ca/${SIGNER_NAME}"
          mkdir -p "${TRUST_STORE_DIR}"
          cp "$HOME/.config/notation/localkeys/${SIGNER_NAME}.crt" "${TRUST_STORE_DIR}/"

          cat > ".notation/trustpolicy.json" <<EOF
          {
            "version": "1.0",
            "trustPolicies": [
              {
                "name": "runpod-policy",
                "registryScopes": ["${IMAGE_REPO}"],
                "signatureVerification": { "level": "strict" },
                "trustStores": ["ca:${SIGNER_NAME}"],
                "trustedIdentities": ["*"]
              }
            ]
          }
          EOF

      - name: Verify Notation signature
        uses: notaryproject/notation-action/verify@v1
        with:
          target_artifact_reference: ${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}
          trust_policy: .notation/trustpolicy.json
          trust_store: .notation/truststore
