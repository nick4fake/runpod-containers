name: Hadolint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add rows when new top-level Dockerfiles appear (e.g. nvidia-pytorch).
        dockerfile:
          - official-templates/base/Dockerfile
          - official-templates/pytorch/Dockerfile
          - official-templates/autoresearch/Dockerfile
          - helper-templates/verify-nccl/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: ./.github/actions/hadolint
        with:
          dockerfile: ${{ matrix.dockerfile }}

      - name: Upload Hadolint SARIF to Code Scanning
        if: ${{ always() && hashFiles('hadolint.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint-${{ replace(matrix.dockerfile, '/', '-') }}
